[project]
name = "troubleshooting-assistant"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.2",
    "langchain-openai>=1.4.1",
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/stubs"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
map = [
    "umap-learn>=0.5.12",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["web", "data", "docs"]
